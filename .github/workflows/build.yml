name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: siteruler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Every build of main replaces the "latest" release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/SiteRuler.apk
      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SiteRuler.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SiteRuler.apk \
            --title "Latest build" \
            --notes "Debug build of ${GITHUB_SHA::7}. Download SiteRuler.apk on your phone and open it to install." \
            --target "$GITHUB_SHA" --latest
